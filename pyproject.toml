[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cursus"
version = "0.1.0"
description = "Turn a written description of a process into a Visio flow, and show which sentence each box came from."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{ name = "Patricia Kusch" }]
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5",
  "pydantic>=2.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.urls]
Homepage = "https://github.com/patkusch/cursus"
Repository = "https://github.com/patkusch/cursus"
Issues = "https://github.com/patkusch/cursus/issues"

[project.scripts]
cursus = "cursus.cli:main"

[tool.setuptools.packages.find]
include = ["cursus*"]

[tool.setuptools.package-data]
cursus = ["seed/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
